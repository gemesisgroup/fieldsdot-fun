<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Not found — FIELDS</title>
  <style>
    :root{--ink:#122d25;--acid:#d4fa77;--paper:#f5f5e9}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;background-image:radial-gradient(#c7d2b9 .8px,transparent .8px);background-size:18px 18px;padding:16px;box-sizing:border-box}
    .box{border:3px solid var(--ink);box-shadow:8px 8px 0 var(--ink);background:#fffef7;padding:40px 32px;text-align:center;max-width:420px}
    .code{font-family:"Courier New",monospace;font-weight:700;letter-spacing:.12em;font-size:12px}
    h1{font-size:44px;letter-spacing:-.06em;text-transform:uppercase;margin:10px 0}
    p{color:#3e5c51}
    a{display:inline-block;margin-top:12px;background:var(--acid);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:10px 16px;font-weight:900;text-transform:uppercase;font-size:12px;color:var(--ink);text-decoration:none}
  </style>
</head>
<body>
  <div class="box"><div class="code">404 / OFF THE FIELD</div><h1>Nothing grows here.</h1><p>This page does not exist.</p><a href="/">Back to the field</a></div>
</body>
</html>
